name: CI

# This is the release gate, not a copy of it: each gate job runs scripts/release_check.py for one
# group of it. scripts/gate_groups.py owns the groups and release_check.py the steps, and the gate
# fails when the groups miss an environment, so nothing here can fall out of step with either.

on:
  push:
    branches: ['**']        # every branch (not tags): immediate feedback on feature branches
  workflow_dispatch:        # allow manual runs from the Actions tab

# Least privilege: these jobs only read the repository. Without this block the
# GITHUB_TOKEN inherits the repository default, which may be read-write.
permissions:
  contents: read

concurrency:                # a newer push to the same ref cancels the in-flight run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A named bash runs with pipefail, the default one without it: `cmd | tee` fails when cmd does.
defaults:
  run:
    shell: bash

env:
  # What the PlatformIO cache keeps. actions/cache archives a matched directory whole, so
  # ~/.platformio is listed level by level to let the exclusions bite. Left out: the download and
  # install staging (.cache, dist, tools), and in the Arduino libraries and the Xtensa toolchain
  # whatever only another ESP chip or picolibc uses; a board on another chip needs its directories
  # listed after the esp32?* lines. The list is part of the cache version, so deps-outdated.yml
  # carries it unchanged.
  PIO_CACHE_PATHS: |
    ~/.platformio/*
    !~/.platformio/.cache
    !~/.platformio/dist
    !~/.platformio/tools
    !~/.platformio/packages
    ~/.platformio/packages/*
    !~/.platformio/packages/framework-arduinoespressif32-libs
    ~/.platformio/packages/framework-arduinoespressif32-libs/*
    !~/.platformio/packages/framework-arduinoespressif32-libs/esp32?*
    !~/.platformio/packages/toolchain-xtensa-esp-elf
    ~/.platformio/packages/toolchain-xtensa-esp-elf/*
    !~/.platformio/packages/toolchain-xtensa-esp-elf/picolibc
    !~/.platformio/packages/toolchain-xtensa-esp-elf/xtensa-esp-elf
    ~/.platformio/packages/toolchain-xtensa-esp-elf/xtensa-esp-elf/*
    !~/.platformio/packages/toolchain-xtensa-esp-elf/xtensa-esp-elf/lib
    ~/.platformio/packages/toolchain-xtensa-esp-elf/xtensa-esp-elf/lib/*
    !~/.platformio/packages/toolchain-xtensa-esp-elf/xtensa-esp-elf/lib/esp32?*
    ~/.cache/pip

jobs:
  gate:
    # One release-gate group per job, so no job needs every toolchain and any runner can take any
    # of them. These need nothing from another job. The esp32 group also hands on the two tools of
    # the pioarduino platform that only that platform installs: the ESP8266 builds use its esptool,
    # and every check_* environment its clang-tidy.
    name: gate (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a cold toolchain install on a slow runner takes ~20min; 60 still catches a hang
    strategy:
      fail-fast: false    # every group reports, whichever fails first
      matrix:
        include:
          - group: host
          - group: avr
            sizes: true
          - group: esp32
            sizes: true
            tools: true
    steps:
      - name: Checkout (full history so GIT_COMMIT_COUNT is correct)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # git_utils.py runs `git rev-list --count HEAD`; a shallow clone reports 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Cache PlatformIO toolchains and pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIO_CACHE_PATHS }}
          key: pio-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.group }}-

      - name: Install PlatformIO + tooling
        # requirements-ci.txt holds what every group needs: pioarduino and intelhex. The host group
        # runs the Python guards too, whose pinned tooling (clang-format/ruff/pyright/pytest/gcovr)
        # and the OTA tool's runtime deps (-r ota/requirements.txt) come from requirements-dev.txt.
        # Into a virtualenv of this job's own. The runner's Python lives in a tool cache every
        # job of a run shares, so a pin that has moved has all of them uninstalling the old
        # version at the same moment, and whichever loses that race fails on a file the winner
        # has already taken away. A virtualenv in the workspace is the job's alone.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ci.txt ${{ matrix.group == 'host' && '-r requirements-dev.txt' || '' }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Pack the pioarduino tools
        # Before the gate, so a failing ESP32 build still lets the other groups run. check_esp32 is
        # the environment whose configuration has the platform install clang-tidy, and `pio project
        # metadata` configures it the way a build does: that turns the platform's download stubs
        # into the two tools. The tests fail the step on a stub left in place of either.
        if: matrix.tools
        run: |
          pio project metadata -e check_esp32 > /dev/null
          test -x ~/.platformio/packages/tool-clangtidy/clang-tidy
          test -d ~/.platformio/packages/tool-esptoolpy/esptool
          tar -C ~/.platformio/packages -cf "$RUNNER_TEMP/pioarduino-tools.tar" tool-esptoolpy tool-clangtidy

      - name: Hand the pioarduino tools on
        if: matrix.tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pioarduino-tools
          path: ${{ runner.temp }}/pioarduino-tools.tar
          retention-days: 1

      - name: Release gate (${{ matrix.group }})
        run: python scripts/release_check.py --group ${{ matrix.group }}

      - name: Firmware size diff
        if: matrix.sizes
        uses: ./.github/actions/size-diff
        with:
          group: ${{ matrix.group }}

  gate-with-tools:
    # The release-gate groups that take the pioarduino tools the esp32 group hands on.
    name: gate (${{ matrix.group }})
    needs: gate
    if: ${{ !cancelled() }}   # the tools come from one group: another failing is no reason to skip these
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: esp8266
            sizes: true
          - group: tidy-esp32
          - group: tidy-esp8266
          - group: tidy-avr
    steps:
      - name: Checkout (full history so GIT_COMMIT_COUNT is correct)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Cache PlatformIO toolchains and pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIO_CACHE_PATHS }}
          key: pio-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.group }}-

      - name: Install PlatformIO + intelhex
        # Into a virtualenv of this job's own, for the reason the gate job gives.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ci.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Take the pioarduino tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pioarduino-tools
          path: ${{ runner.temp }}

      - name: Install the pioarduino tools
        # In place of any older copy the cache brought: unpacking over one would leave its files.
        run: |
          mkdir -p ~/.platformio/packages
          rm -rf ~/.platformio/packages/tool-esptoolpy ~/.platformio/packages/tool-clangtidy
          tar -C ~/.platformio/packages -xf "$RUNNER_TEMP/pioarduino-tools.tar"

      - name: Release gate (${{ matrix.group }})
        run: python scripts/release_check.py --group ${{ matrix.group }}

      - name: Firmware size diff
        if: matrix.sizes
        uses: ./.github/actions/size-diff
        with:
          group: ${{ matrix.group }}

  coverage:
    # Native-test line coverage over lib/ (gcovr); no coverage threshold, it fails only when
    # the instrumented tests or the report do.
    # Reports all of lib/ — the headline is pulled down by vendored third-party code (notably
    # lib/dfPlayer/.../DFPlayerMiniFast.cpp); add a gcovr --exclude for a cleaner own-code number.
    runs-on: ubuntu-latest
    timeout-minutes: 30   # only ~3min even on the laptop; a generous ceiling that still catches a hang
    steps:
      - name: Checkout (full history so GIT_COMMIT_COUNT is correct)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # same as the gate jobs; a shallow clone builds with a count of 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # No PlatformIO cache: the native tests build with the host compiler, and restoring the
      # toolchains the other jobs cache takes longer than installing what this job uses.
      - name: Install PlatformIO + gcovr
        # gcovr comes from requirements-dev.txt, pioarduino from requirements-ci.txt (see the gate job).
        # Into a virtualenv of this job's own. The runner's Python lives in a tool cache every
        # job of a run shares, so a pin that has moved has all of them uninstalling the old
        # version at the same moment, and whichever loses that race fails on a file the winner
        # has already taken away. A virtualenv in the workspace is the job's alone.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ci.txt -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Native tests with coverage instrumentation
        run: PLATFORMIO_BUILD_FLAGS="-lgcov --coverage" pio test -e native_test

      - name: Coverage report (lib/)
        # Pretty markdown table in the summary, plus a collapsible plain-text report whose
        # "Missing" column lists the uncovered line ranges per file (the markdown format omits
        # those). gcovr's INFO logs go to stderr, so only the report bodies reach the summary.
        run: |
          gcovr --root . --filter 'lib/' --markdown | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "<details>"
            echo "<summary>Uncovered lines (per file)</summary>"
            echo ""
            echo '```text'
            gcovr --root . --filter 'lib/'
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    # The one status master's branch protection requires. always(): a failed job above
    # turns this red instead of skipping it.
    if: always()
    needs: [gate, gate-with-tools, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every release-gate group and the coverage run passed
        run: |
          test "${{ needs.gate.result }}" = success
          test "${{ needs.gate-with-tools.result }}" = success
          test "${{ needs.coverage.result }}" = success
