name: CI

# This is the release gate, not a copy of it: each gate job runs scripts/release_check.py for one
# group of it. scripts/gate_groups.py owns the groups and release_check.py the steps, and the gate
# fails when the groups miss an environment, so nothing here can fall out of step with either. Every
# group runs in an image that has the toolchains and the tooling (ci/toolchain.Dockerfile). A push
# that changed nothing but Markdown runs the host group alone: no firmware can differ. A v<N> tag
# (scripts/release_tag.py) runs the same jobs, then publishes its ESP firmware as a release and
# the web installer around it.

on:
  push:
    branches: ['**']        # every branch: immediate feedback on feature branches
    tags: ['v*']            # a release, published once the check below passes
  workflow_dispatch:        # allow manual runs from the Actions tab

# Least privilege: these jobs only read the repository. Without this block the
# GITHUB_TOKEN inherits the repository default, which may be read-write.
permissions:
  contents: read

concurrency:                # a newer push to the same ref cancels the in-flight run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A named bash runs with pipefail, the default one without it: `cmd | tee` fails when cmd does.
defaults:
  run:
    shell: bash

jobs:
  image:
    # The toolchain image the gate jobs run in, tagged with a hash of what goes into it
    # (scripts/toolchain_key.py) and handed on pinned by digest. It is built and pushed only when the
    # registry has no image with that tag: on the forge with the PACKAGES_TOKEN secret, on GitHub to
    # ghcr.io with the job's own token.
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a build installs every toolchain and pushes some 2GB; a hang still ends
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
      firmware: ${{ steps.changes.outputs.firmware }}
      matrix: ${{ steps.groups.outputs.matrix }}
    env:
      TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tell whether the push changed more than Markdown
        # Everything runs unless the commit the push started from can be fetched and compared: a new
        # branch has none, and a force-push may have dropped it.
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          firmware=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${BEFORE//0/}" ] \
             && git fetch -q --no-tags --depth=1 origin "$BEFORE" \
             && git diff --quiet "$BEFORE" HEAD -- . ':(exclude)*.md'; then
            firmware=false
          fi
          echo "firmware=$firmware" | tee -a "$GITHUB_OUTPUT"

      - name: Generate the gate matrix
        id: groups
        run: echo "matrix=$(python3 scripts/gate_groups.py)" >> "$GITHUB_OUTPUT"

      - name: Name the image
        id: name
        run: |
          if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
            registry=ghcr.io
          else
            registry=${GITHUB_SERVER_URL#*://}
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          tag=$(python3 scripts/toolchain_key.py)
          echo "ref=$registry/$owner/cansystems-toolchain:$tag" >> "$GITHUB_OUTPUT"

      - name: Look the image up in the registry
        id: lookup
        # The registry API answers a manifest request with 200 when the tag exists, after the bearer
        # token its WWW-Authenticate header names the realm for; the manifest's hash is its digest.
        env:
          REF: ${{ steps.name.outputs.ref }}
        run: |
          registry=${REF%%/*}; path=${REF#*/}; repository=${path%:*}; tag=${path##*:}
          challenge=$(curl -sS -o /dev/null -D - "https://$registry/v2/" | tr -d '\r' | sed -n 's/^[Ww]ww-[Aa]uthenticate: Bearer //p')
          realm=$(echo "$challenge" | sed -E 's/.*realm="([^"]+)".*/\1/')
          service=$(echo "$challenge" | sed -E 's/.*service="([^"]+)".*/\1/')
          bearer=$(curl -fsS -u "$GITHUB_REPOSITORY_OWNER:$TOKEN" \
            "$realm?service=$service&scope=repository:$repository:pull" | jq -r '.token // .access_token')
          status=$(curl -s -o "$RUNNER_TEMP/manifest" -w '%{http_code}' -H "Authorization: Bearer $bearer" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://$registry/v2/$repository/manifests/$tag")
          echo "manifest: HTTP $status"
          if [ "$status" = 200 ]; then
            echo "digest=sha256:$(sha256sum < "$RUNNER_TEMP/manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        # buildah needs no daemon: in a job container it builds with chroot isolation and vfs storage.
        id: build
        if: steps.lookup.outputs.digest == ''
        env:
          REF: ${{ steps.name.outputs.ref }}
        run: |
          if ! command -v buildah > /dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq buildah > /dev/null
          fi
          buildah --storage-driver vfs build --isolation chroot -f ci/toolchain.Dockerfile -t "$REF" .
          echo "$TOKEN" | buildah login --username "$GITHUB_REPOSITORY_OWNER" --password-stdin "${REF%%/*}"
          buildah --storage-driver vfs push --digestfile "$RUNNER_TEMP/digest" "$REF"
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

      - name: Pin the image by digest
        id: pin
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.lookup.outputs.digest || steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "$REF is $DIGEST"
          echo "ref=${REF%:*}@$DIGEST" >> "$GITHUB_OUTPUT"

  host:
    # The release-gate group every push runs: the native tests and the Python guards, the format and
    # secret checks a change to Markdown needs among them.
    name: gate-host   # no space in a job name: see the gate job
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ~2min on a fast runner; a generous ceiling that still catches a hang
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}   # zizmor: ignore[unpinned-images] a digest, from the image job
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (full history so GIT_COMMIT_COUNT is correct)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # same as the gate jobs; a shallow clone builds with a count of 1
          persist-credentials: false

      - name: Use the image's PlatformIO and tooling
        run: echo /opt/pio/bin >> "$GITHUB_PATH"

      - name: Release gate (host)
        run: python scripts/release_check.py --group host

  gate:
    # The firmware groups of the release gate, one per job, in the toolchain image: no job restores
    # or installs a toolchain or the Python tooling, and any runner can take any of them.
    # No space in the name: a runner hands it to the job container as a network alias, and an older
    # netavark writes that unchecked into aardvark-dns's space-separated config, killing its DNS.
    name: gate-${{ matrix.group }}
    needs: image
    if: needs.image.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # tidy-esp32, the longest, takes ~12min on a fast runner and three times that on the slowest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}   # zizmor: ignore[unpinned-images] a digest, from the image job
      # The same token the image job pushes with; a runner refuses credentials that come out empty.
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false    # every group reports, whichever fails first
      matrix: ${{ fromJSON(needs.image.outputs.matrix) }}
    steps:
      - name: Checkout (full history so GIT_COMMIT_COUNT is correct)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # git_utils.py runs `git rev-list --count HEAD`; a shallow clone reports 1
          persist-credentials: false    # size-diff's fetch reads the repository anonymously

      - name: Use the image's PlatformIO and tooling
        run: echo /opt/pio/bin >> "$GITHUB_PATH"

      - name: Release gate (${{ matrix.group }})
        env:
          GROUP: ${{ matrix.group }}
        run: python scripts/release_check.py --group "$GROUP"

      - name: Firmware size diff
        if: matrix.sizes
        uses: ./.github/actions/size-diff
        with:
          group: ${{ matrix.group }}

  coverage:
    # Native-test line coverage over lib/ (gcovr); no coverage threshold, it fails only when
    # the instrumented tests or the report do.
    # Reports all of lib/ — the headline is pulled down by vendored third-party code (notably
    # lib/dfPlayer/.../DFPlayerMiniFast.cpp); add a gcovr --exclude for a cleaner own-code number.
    needs: image
    if: needs.image.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # only ~3min even on the laptop; a generous ceiling that still catches a hang
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}   # zizmor: ignore[unpinned-images] a digest, from the image job
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (full history so GIT_COMMIT_COUNT is correct)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # same as the gate jobs; a shallow clone builds with a count of 1
          persist-credentials: false

      - name: Use the image's PlatformIO and gcovr
        run: echo /opt/pio/bin >> "$GITHUB_PATH"

      - name: Native tests with coverage instrumentation
        run: PLATFORMIO_BUILD_FLAGS="-lgcov --coverage" pio test -e native_test

      - name: Coverage report (lib/)
        # Pretty markdown table in the summary, plus a collapsible plain-text report whose
        # "Missing" column lists the uncovered line ranges per file (the markdown format omits
        # those). gcovr's INFO logs go to stderr, so only the report bodies reach the summary.
        run: |
          gcovr --root . --filter 'lib/' --markdown | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "<details>"
            echo "<summary>Uncovered lines (per file)</summary>"
            echo ""
            echo '```text'
            gcovr --root . --filter 'lib/'
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    # The one status master's branch protection requires. always(): a failed job above
    # turns this red instead of skipping it.
    if: always()
    needs: [image, host, gate, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The toolchain image, every release-gate group and the coverage run passed
        # The firmware groups and the coverage run may be skipped only for a push the image job found
        # to change nothing but Markdown.
        env:
          IMAGE: ${{ needs.image.result }}
          HOST: ${{ needs.host.result }}
          GATE: ${{ needs.gate.result }}
          COVERAGE: ${{ needs.coverage.result }}
          FIRMWARE: ${{ needs.image.outputs.firmware }}
        run: |
          test "$IMAGE" = success
          test "$HOST" = success
          if [ "$FIRMWARE" = true ]; then expected=success; else expected=skipped; fi
          test "$GATE" = "$expected"
          test "$COVERAGE" = "$expected"

  release:
    # The ESP firmware of a v<N> tag as a release on this forge, replacing the older ones.
    needs: [image, check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}   # zizmor: ignore[unpinned-images] a digest, from the image job
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (full history so GIT_COMMIT_COUNT is correct)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the image's PlatformIO
        run: echo /opt/pio/bin >> "$GITHUB_PATH"

      - name: The tag names a master commit and the version its firmware reports
        run: |
          test "$GITHUB_REF_NAME" = "v$(git rev-list --count HEAD)"
          git merge-base --is-ancestor HEAD origin/master

      - name: Build the released firmware and its configuration templates
        run: |
          mapfile -t envs < <(python web/installer.py envs)
          pio run "${envs[@]/#/-e}"
          python web/installer.py assets --into release

      - name: Publish the release
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/forge_release.py publish --tag "$GITHUB_REF_NAME" --keep 1 release/*

  pages:
    # The web installer around the release just published. Upload and deployment carry no host
    # filter, so they work on a forge once it serves Pages; until then their failures only warn.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the installer from the release's files
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/forge_release.py download --tag "$GITHUB_REF_NAME" --into release
          python3 web/installer.py build --firmware release --version "$GITHUB_REF_NAME" --output site

      - name: Upload the installer
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 7

      - name: Deploy the installer
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Report the unpublished installer
        if: failure()
        run: echo "::warning::The web installer was not published; the release itself is unaffected."
