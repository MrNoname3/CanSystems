common:
  commands:
    - name: Reboot
      description: Restarts the device
      cmd: "reboot"

projects:
  - name: "Radiation detector"
    pio_project: project_esp8266_rad
    devices:
      - mac: c82b96034710
        friendly_name: "Home BP"
        server_config:
          haDiscovery: true
        files:
          - name: "CA certificate upload"
            local_path: mosq-ca.crt
            device_path: /config/mosq-ca.crt
          - name: "Server configuration upload"
            render: server_json
            device_path: /config/server.json
          - name: "Tube configuration upload"
            content:
              tube: 1                       # 1 = J305, 2 = M4011
            device_path: /config/tube.json
      - mac: cc50e30872d3
        friendly_name: "Home H"
        server_config:
          haDiscovery: true
        files:
          - name: "CA certificate upload"
            local_path: mosq-ca.crt
            device_path: /config/mosq-ca.crt
          - name: "Server configuration upload"
            render: server_json
            device_path: /config/server.json
          - name: "Tube configuration upload"
            content:
              tube: 1                       # 1 = J305, 2 = M4011
            device_path: /config/tube.json

  - name: "CAN gateway"
    pio_project: project_esp32_can
    devices:
      - mac: fcf5c401bd83
        friendly_name: "Home BP living room"
        server_config:
          haDiscovery: true
        files:
          - name: "CA certificate upload"
            local_path: mosq-ca.crt
            device_path: /config/mosq-ca.crt
          - name: "Server configuration upload"
            render: server_json
            device_path: /config/server.json
          - name: "CAN alert firmware upload"
            local_path: ../.pio/build/nanoatmega328_alert/firmware.bin
            pio_env: nanoatmega328_alert
            device_path: /canAlertFw.bin

  - name: "Thermometer"
    pio_project: project_esp8266_thermo
    devices:
      - mac: bcddc2b622c9
        friendly_name: "Home BP"
        server_config:
          haDiscovery: true
        files:
          - name: "CA certificate upload"
            local_path: mosq-ca.crt
            device_path: /config/mosq-ca.crt
          - name: "Server configuration upload"
            render: server_json
            device_path: /config/server.json
      - mac: 40f52033765d
        friendly_name: "Test2"
        server_config:
          haDiscovery: true
        files:
          - name: "CA certificate upload"
            local_path: mosq-ca.crt
            device_path: /config/mosq-ca.crt
          - name: "Server configuration upload"
            render: server_json
            device_path: /config/server.json

# The order --rollout walks, and how long each device has to hold its connection before the next
# one is started. Test2 goes first as the canary: it is the run that decides whether the build
# reaches a real device at all, so it gets the longest soak. The radiation detectors are taken
# last, Home H last of all. The CAN gateway's alert image is sent ahead of its own firmware, so
# the nodes behind it (alert1, alert2) are reflashed through the build the gateway was already
# proven on.
rollout:
  soak_seconds: 300               # Connectivity::onlineSettleTime: what the firmware calls settled.
  steps:
    - mac: 40f52033765d           # Thermometer "Test2"
      soak_seconds: 900
    - mac: bcddc2b622c9           # Thermometer "Home BP"
    - mac: fcf5c401bd83           # CAN gateway "Home BP living room"
      reboot_timeout: 120         # An ESP32 with CAN nodes to bring back up behind it.
      before_firmware:
        - "CAN alert firmware upload"
    - mac: c82b96034710           # Radiation detector "Home BP"
    - mac: cc50e30872d3           # Radiation detector "Home H"
