      - mac: bcddc2b622c9
        friendly_name: "Home BP"
        server_config:
          haDiscovery: true
        files:
          - name: "CA certificate upload"
            local_path: mosq-ca.crt
            device_path: /config/mosq-ca.crt
          - name: "Server configuration upload"
            render: server_json
            device_path: /config/server.json
      - mac: 40f52033765d
        friendly_name: "Test2"
        server_config:
          haDiscovery: true
        files:
          - name: "CA certificate upload"
            local_path: mosq-ca.crt
            device_path: /config/mosq-ca.crt
          - name: "Server configuration upload"
            render: server_json
            device_path: /config/server.json

# The order --rollout walks. Each step is one device, started only once the step before it has
# held its connection for its soak; the first failure stops the run, no board here being able to
# roll back. Where a device belongs is a judgement about blast radius: whichever is cheapest to
# lose goes first, as the run that decides whether the build reaches a real device at all - and
# earns the longest soak for it - while one whose failure takes others down with it is worth
# leaving until the devices it would take are already done.
#
#   soak_seconds     how long a device has to hold its connection before the next step starts.
#                    The section value is the default; a step may name its own. For scale: the
#                    firmware's own Connectivity::onlineSettleTime is five minutes, which is how
#                    long a link has to hold before it clears the reconnect backoff ladder.
#   reboot_timeout   how long to wait for a device to come back and report the new build.
#   before_firmware  file entries sent ahead of the device's own image, in the order given. A
#                    gateway's CAN node firmware goes here, one entry per node role, so the nodes
#                    behind it are reflashed through the build that gateway was already proven on.
rollout:
  soak_seconds: 180
  steps:
    - mac: 40f52033765d           # Thermometer "Test2"
      soak_seconds: 360
    - mac: bcddc2b622c9           # Thermometer "Home BP"
    - mac: fcf5c401bd83           # CAN gateway "Home BP living room"
      reboot_timeout: 120         # An ESP32 with CAN nodes to bring back up behind it.
      before_firmware:
        - "CAN alert firmware upload"
    - mac: c82b96034710           # Radiation detector "Home BP"
    - mac: cc50e30872d3           # Radiation detector "Home H"
