; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

;****************** PLATFORMIO ******************
[platformio]
default_envs =
  nanoatmega328_alert
  nanoatmega328_irrigation
  project_esp32_can
  project_esp8266_rad
  project_esp8266_thermo
  native_test

;****************** ENV ******************
[env]
framework = arduino
monitor_speed = 115200                                  ; serial monitor speed
monitor_filters = time, default, log2file               ; serial monitor setup
; cppcheck is pinned here; scripts/analysis_check.py runs it, and the .venv's clang-tidy, over each
; environment's compilation database. An env that names its own platform_packages repeats this
; list, as it replaces rather than extends.
platform_packages =
  platformio/tool-cppcheck@1.21100.230717
extra_scripts =
  pre:scripts/git_commit_info.py
  pre:scripts/compiledb_path.py
; Every suite builds against test/_shims and the host test runner, so none of them belongs to a
; hardware environment. The wildcard covers suites added later too; native_test clears it below.
test_ignore = *
; build options
build_flags =
  '-DBUILD_ENV_NAME="$PIOENV"'
  '-DMONITOR_BAUD=${env.monitor_speed}'
  '-DGIT_COMMIT_HASH=$GIT_COMMIT_HASH'
  '-DGIT_COMMIT_COUNT=$GIT_COMMIT_COUNT'
  '-DGIT_DIRTY=$GIT_DIRTY'
  '-DMASTER_CAN_ADDRESS=10U'
  ;'-DNEW_CAN_ADDRESS = 26U'
  '-DMQTT_MAX_PACKET_SIZE=1024'
  -Wall
  -Wextra
  -Werror

;****************** ENV:NANOATMEGA328_BASE ******************
[env:nanoatmega328_base]
platform = atmelavr@5.3.0
board = nanoatmega328new
; Pinned exact so a toolchain change is always a commit; the platform asks for the core as
; ~5.4.0. avrdude is deliberately the newest the registry offers, ahead of the platform default.
platform_packages =
  ${env.platform_packages}
  platformio/framework-arduino-avr@5.4.0
  platformio/tool-avrdude@1.80100.0
monitor_port =                                  ; serial monitor port
upload_port =                                   ; serial port to upload code
upload_speed = 115200                           ; set upload speed
;upload_protocol = arduino                       ; set upload protocol -> Serial upload via Optiboot / Urboot bootloader
upload_protocol = urclock                       ; set upload protocol -> Serial upload via Urboot bootloader
;upload_protocol = usbasp                        ; set upload protocol -> ISP upload via USBAsp programmer
;upload_protocol = avrisp                        ; set upload protocol -> ISP upload via Arduino as ISP programmer
;board_upload.maximum_size = 31744               ; Our bootloader section is only 1024byte. Real available flash size is: 32Kb - 1Kb.
board_upload.maximum_size = 32256               ; Our bootloader section is only 512byte. Real available flash size is: 32Kb - 0.5Kb.
extra_scripts =
  ${env.extra_scripts}
  pre:scripts/relax_core_warnings.py
  post:scripts/elf_to_bin.py
; build options
build_unflags =
  -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=c++17
  '-DPROGRAM_MEMORY_SIZE=${env:nanoatmega328_base.board_upload.maximum_size}'
build_src_filter =
  -<*>
  +<main.cpp>
lib_ignore =
  connectivity
; libraries
lib_deps =

;****************** ENV:NANOATMEGA328_BOOTLOADER_URBOOT771 ******************
[env:nanoatmega328_bootloader_urboot771]
extends = env:nanoatmega328_base
upload_protocol = usbasp
board_upload.maximum_size = 31744        ; hfuse 0xD4 below reserves 1Kb, not the base env's 0.5Kb
;https://eleccelerator.com/fusecalc/fusecalc.php?chip=atmega328p&LOW=FF&HIGH=D4&EXTENDED=FC&LOCKBIT=CF
board_fuses.lfuse = 0xFF    ;original: FF
board_fuses.hfuse = 0xD4    ;original: DA
board_fuses.efuse = 0xFC    ;original: FD
;board_fuses.lock = 0xCF     ;original: 0F
board_bootloader.file = ./bootloader/urboot_771_m328p_1s_x16m0_115k2_uart0_rxd0_txd1_led+d4_csb0_dual_ee_ce_hw_stk500.hex
board_bootloader.lfuse = 0xFF           ;original: FF
board_bootloader.hfuse = 0xD4           ;original: DA
board_bootloader.efuse = 0xFC           ;original: FD
board_bootloader.lock_bits = 0xCF       ;original: 0F
board_bootloader.unlock_bits = 0xFF     ;original: 3F

;****************** ENV:NANOATMEGA328_BOOTLOADER_URBOOT800 ******************
[env:nanoatmega328_bootloader_urboot800]
extends = env:nanoatmega328_base
upload_protocol = usbasp
;https://eleccelerator.com/fusecalc/fusecalc.php?chip=atmega328p&LOW=FF&HIGH=D6&EXTENDED=FC&LOCKBIT=CF
board_fuses.lfuse = 0xFF    ;original: FF
board_fuses.hfuse = 0xD6    ;original: DA
board_fuses.efuse = 0xFC    ;original: FD
;board_fuses.lock = 0xCF     ;original: 0F
board_bootloader.file = ./bootloader/urboot_800_m328p_1s_x16m0_115k2_uart0_rxd0_txd1_led+d4_csb0_dual_ee_ce_hw.hex
board_bootloader.lfuse = 0xFF           ;original: FF
board_bootloader.hfuse = 0xD6           ;original: DA
board_bootloader.efuse = 0xFC           ;original: FD
board_bootloader.lock_bits = 0xCF       ;original: 0F
board_bootloader.unlock_bits = 0xFF     ;original: 3F

;****************** AVR_NODE ******************
; What the ATmega328P node firmwares add to nanoatmega328_base, which the bootloader
; environments take as it is.
[avr_node]
extra_scripts =
  ${env:nanoatmega328_base.extra_scripts}
  post:scripts/check_avr_startup.py
  post:scripts/check_avr_memory.py
lib_deps =
  ${env:nanoatmega328_base.lib_deps}
  WS2812Driver=makuna/NeoPixelBus@2.8.4

;****************** ENV:NANOATMEGA328_ALERT ******************
[env:nanoatmega328_alert]
extends = env:nanoatmega328_base, avr_node
build_src_filter =
  -<*>
  +<main_atmega328_alert.cpp>

;****************** ENV:NANOATMEGA328_IRRIGATION ******************
[env:nanoatmega328_irrigation]
extends = env:nanoatmega328_base, avr_node
build_src_filter =
  -<*>
  +<main_atmega328_irrigation.cpp>

;****************** ENV:ESP32_BASE ******************
[env:esp32_base]
; pioarduino community platform: Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5. A release URL pins the
; platform and its framework together, so a core change is always a commit here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board = lolin32
board_build.f_flash = 80000000L                 ; Set flash frequency to 80MHz.
monitor_port =                                  ; Select serial monitor port.
upload_port =                                   ; Select serial port to upload code.
upload_speed = 921600                           ; Set upload speed.
upload_protocol = esptool                       ; Serial->esptool, debugger->esp-prog
board_build.filesystem = littlefs               ; Used filesystem on SPI's FS space
board_build.partitions = partitions_esp32_4mb.csv   ; two OTA slots of 1.625MB, 640KB filesystem
monitor_filters =
  ${env.monitor_filters}
  esp32_exception_decoder
extra_scripts =
  ${env.extra_scripts}
  post:scripts/esp32_drop_matter.py
build_unflags =                                 ; the framework's own standard; every target builds as C++17
  -std=gnu++2a
  -std=gnu++2b
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1                          ; Debug level -> 0:none, 1:error, 2:warn, 3:info, 4:debug, 5:verbose
lib_ignore =
  ota
debug_tool = esp-prog                           ; Debugger options.
debug_init_break = tbreak setup                 ; It stops the program at "void setup()" function.
debug_speed = 20000                             ; Fixed debug speed in kHz.
build_src_filter =
  -<*>
  +<main.cpp>

;****************** ENV:PROJECT_ESP32_CAN ******************
[env:project_esp32_can]
extends = env:esp32_base
; libraries
lib_deps =
  JSONHandler=bblanchon/ArduinoJson@7.4.3
build_src_filter =
  -<*>
  +<main_esp32_can.cpp>

;****************** ENV:ESP8266_BASE ******************
[env:esp8266_base]
platform = espressif8266@4.2.1
board = d1_mini
; esptool is the pioarduino platform's copy, named by its directory: that platform deletes every
; other tool-esptoolpy, so a copy of the ESP8266's own would be installed again on every run. It
; flashes the ESP8266 with this platform's flags. The ESP32 environments come first in this file
; because pio takes the environments in file order, so on a fresh machine the copy is there by the
; time these ask for it.
platform_packages =
  ${env.platform_packages}
  platformio/framework-arduinoespressif8266@3.30102.0
  tool-esptoolpy@${platformio.packages_dir}/tool-esptoolpy
board_build.f_cpu = 160000000L                  ; MCU frequency
board_build.f_flash = 80000000L                 ; External SPI FLASH speed
board_build.flash_mode = qio                    ; SPI FLASH uplad method
monitor_port =                                  ; serial monitor port
upload_port =                                   ; serial port to upload code
upload_speed = 921600                           ; set upload speed
upload_protocol = esptool                       ; set upload protocol -> Serial upload
board_build.filesystem = littlefs               ; Used filesystem on SPI's FS space
board_build.ldscript = eagle.flash.4m2m.ld      ; FLASH partitioning: sketch-1019KB, OTA-1028KB, FS-2024KB
monitor_filters =
  ${env.monitor_filters}
  esp8266_exception_decoder
extra_scripts =
  ${env.extra_scripts}
  pre:scripts/patch_elf2bin.py
  post:scripts/check_esp8266_memory.py
build_flags =
  ${env.build_flags}
  ;-DATOMIC_FS_UPDATE
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
  ;-DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48  ; halves the icache for IRAM nothing here uses
  ;-DBEARSSL_SSL_BASIC  ; disabled for full ECDSA support — restore if heap is insufficient
  -DVTABLES_IN_FLASH
  ;-DDEBUG_ESP_PORT=Serial
  ;-DDEBUG_ESP_SSL
  ;-DDEBUG_ESP_TLS_MEM
  ;-DDEBUG_ESP_HTTP_CLIENT
  ;-DDEBUG_ESP_HTTP_SERVER
  ;-DDEBUG_ESP_CORE
  ;-DDEBUG_ESP_WIFI
  ;-DDEBUG_ESP_HTTP_UPDATE
  ;-DDEBUG_ESP_UPDATER
  ;-DDEBUG_ESP_OTA
build_src_filter =
  -<*>
  +<main.cpp>

;****************** ENV:PROJECT_ESP8266_RAD ******************
[env:project_esp8266_rad]
extends = env:esp8266_base
;build_type = debug
; libraries
lib_deps =
  JSONHandler=bblanchon/ArduinoJson@7.4.3
build_src_filter =
  -<*>
  +<main_esp8266_rad.cpp>

;****************** ENV:PROJECT_ESP8266_THERMO ******************
[env:project_esp8266_thermo]
extends = env:esp8266_base
; OneWireNg replaces paulstoffregen/OneWire as a maintained drop-in under DallasTemperature: it
; builds clean under -Werror (paulstoffregen does not), and the ESP8266 has no RMT, so the 1-Wire
; bus is bit-banged either way. lib_ignore OneWire so DallasTemperature picks up OneWireNg's drop-in.
lib_deps =
  JSONHandler=bblanchon/ArduinoJson@7.4.3
  DallasTemperature=milesburton/DallasTemperature@4.0.6
  OneWireDriver=pstolarz/OneWireNg@0.14.1
lib_ignore =
  OneWire
build_src_filter =
  -<*>
  +<main_esp8266_thermo.cpp>

;****************** ENV:NATIVE_TEST ******************
[env:native_test]
platform = native
framework =
test_framework = custom
build_src_filter =
  -<*>
  +<main_native.cpp>
build_flags =
  -std=c++17
  '-DMQTT_MAX_PACKET_SIZE=1024'
  '-DBUILD_ENV_NAME="native_test"'
  '-DGIT_COMMIT_COUNT=0'
  '-DGIT_COMMIT_HASH=0'
  '-DGIT_DIRTY=0'
  '-DPROGRAM_MEMORY_SIZE=${env:nanoatmega328_base.board_upload.maximum_size}'
  '-DNATIVE_TEST'                           ; exposes FileName paths (common.hpp) for host config tests
  -Itest/_shims/src                         ; the shims stand in for the platform headers, so every library sees them
  -Wall
  -Wextra
  -Werror
  -fsanitize=address,undefined              ; runtime memory + UB checks (host-only; native run exercises shared lib/ logic)
  -fno-omit-frame-pointer                   ; readable sanitizer stack traces
  -fno-sanitize-recover=all                 ; turn any UB into a hard failure so the gate catches it
lib_deps =
  bblanchon/ArduinoJson@7.4.3             ; configHandler JSON parsing (header-only, host-compatible)
lib_extra_dirs = test/_shims
lib_ignore =
  resetHandler                             ; common.cpp conditionally includes resetHandler (ESP only); LDF follows it unconditionally
  SPIFlash                                 ; replaced by test/_shims/src/SPIFlash.h for native OTA tests
  RCSwitch                                 ; interrupt-driven RF lib; replaced by test/_shims/src/RCSwitch.h for rfHandler tests
  connectivity                             ; ESP-only MQTT/WiFi stack; shimmed for ambientSensor tests via Wire.h
  ds18b20Reader                            ; ESP-only (OneWire + DallasTemperature); replaced by test/_shims/src/ds18b20Reader.hpp
test_ignore =                              ; override base: run all native test suites
