# Python tooling configuration. The project is firmware-first; these settings cover the
# auxiliary Python (ota/, scripts/, the custom test runner).
#
# ruff is used for LINTING only, enforced by the release gate (scripts/lint_check.py, run by
# release_check.py and in CI). `ruff format` is intentionally NOT run: it collapses the
# project's manually column-aligned trailing comments (it has no AlignTrailingComments option,
# unlike clang-format). The line-length below only applies if someone runs `ruff format` by hand.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The rule set is pinned by explicit code (never ruff's implicit default): ruff 0.16 massively
# expanded that default, so relying on it turned on dozens of rules on a version bump. Pinning
# keeps the lint surface stable across upgrades. Beyond the historical default (pyflakes F +
# pycodestyle E4/E7/E9; E501 line-length stays off), a curated set of high-value rules is added.
# Deliberately NOT adopted: UP006/UP035/UP045 (list/X|None rewrites would break the manually
# column-aligned trailing comments, since `ruff format` is never run to re-align them).
select = [
    "E4", "E7", "E9", "F",          # ruff's historical default (pyflakes + pycodestyle subset)
    "I",                            # import sorting (isort)
    "B904", "B905",                 # exception chaining (raise ... from), zip(..., strict=)
    "UP015", "UP024", "UP037",      # drop redundant open mode, OSError aliases, quoted annotations
    "RUF005", "RUF012", "RUF100",   # iterable unpacking, ClassVar for mutable defaults, dead noqa
    "SIM102",                       # collapse nested if into a single condition
    "PLW1510",                      # subprocess.run needs an explicit check= (intent is documented)
    "PLW0108", "FLY002",            # drop needless lambda, static str.join -> literal
    "EXE001",                       # a file with a shebang must be executable
]

[tool.ruff.lint.per-file-ignores]
# PlatformIO SCons build scripts: Import("env") injects names ruff cannot see, and the
# import of project helpers legitimately follows that call (so F821 + E402 are expected).
# This one only needs F821: its own imports precede Import("env"), so nothing trails it.
"scripts/check_avr_startup.py" = ["F821"]
"scripts/check_esp8266_memory.py" = ["F821"]
"scripts/elf_to_bin.py" = ["F821", "E402"]
"scripts/git_commit_info.py" = ["F821", "E402"]
"scripts/patch_elf2bin.py" = ["F821", "E402"]
"scripts/relax_core_warnings.py" = ["F821", "E402"]

# Static type checking (run by scripts/typecheck_check.py, enforced in CI). Strict over the OTA
# tool, the dev scripts and the OTA tests. Excluded: the four SCons build scripts (Import("env")
# injects names pyright cannot see, same reason they are ruff per-file-ignored above), and the
# PlatformIO test runner, which subclasses an API that lives in PlatformIO's own penv rather
# than the .venv pyright runs against. ruff still covers all of them. The OTA tool's
# third-party deps are resolved via the interpreter the runner passes with --pythonpath
# (the project-root .venv locally, the CI interpreter in CI).
[tool.pyright]
include = ["ota", "scripts", "test"]
# ota/ on the import path so the tests resolve `import otaUpdate` (as they do at runtime).
extraPaths = ["ota"]
exclude = [
    "**/.venv",
    "**/__pycache__",
    ".pio",
    "scripts/check_avr_startup.py",
    "scripts/check_esp8266_memory.py",
    "scripts/elf_to_bin.py",
    "scripts/git_commit_info.py",
    "scripts/patch_elf2bin.py",
    "scripts/relax_core_warnings.py",
    "test/test_custom_runner.py",
]
typeCheckingMode = "strict"

# Unit tests legitimately reach into the classes they test, so the protected-access rule would
# fire on normal test code; disable it for the tests only (everything else stays strict).
[[tool.pyright.executionEnvironments]]
root = "ota/tests"
reportPrivateUsage = false


# pytest unit tests for the OTA tool and the build helpers (run by scripts/pytest_check.py,
# enforced in CI).
[tool.pytest.ini_options]
testpaths = ["ota/tests", "scripts/tests"]
